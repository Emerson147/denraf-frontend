<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>DenRaf - Sistema de Gestión Empresarial</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema moderno de gestión de ventas, inventario y analytics para negocios">
  <meta name="theme-color" content="#1c1917">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DenRaf">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
  
  <!-- OPTIMIZACIÓN: Preload fonts críticas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Fonts con display=swap para evitar FOIT (Flash of Invisible Text) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- LAZY LOAD: Material Symbols solo cuando sea necesario -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet"></noscript>
  
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root>
    <!-- 🚀 OPTIMIZACIÓN: Loader mientras carga la app -->
    <!-- 🚀 Loader Zen Premium -->
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#f8fafc;transition: background 0.3s ease;">
      <div style="text-align:center; animation: fadeIn 0.8s ease-out;">
        <div style="position:relative; margin-bottom: 24px; display: inline-block;">
          <!-- Icono de Ropa (Material Symbol) -->
          <span class="material-symbols-outlined" style="font-size: 64px; color: #1c1917; animation: pulse 2s infinite ease-in-out;">
            checkroom
          </span>
          <!-- Spinner sutil exterior -->
          <div style="position:absolute; top:-12px; left:-12px; width:88px; height:88px; border:2px solid #e7e5e4; border-top-color:#1c1917; border-radius:50%; animation:spin 1.5s linear infinite;"></div>
        </div>
        
        <h1 style="color:#1c1917; font-family:'Inter', system-ui, sans-serif; font-size:18px; font-weight:600; letter-spacing:-0.025em; margin:0;">
          Den<span style="color:#a8a29e;">Raf</span>
        </h1>
        <p style="color:#78716c; font-family:'Inter', system-ui, sans-serif; font-size:12px; font-weight:500; margin-top:8px; text-transform:uppercase; letter-spacing:0.1em;">
          Importaciones
        </p>

        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
          @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.95); } }
          @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
          body { margin: 0; }
        </style>
      </div>
    </div>
  </app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
